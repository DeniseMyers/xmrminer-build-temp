name: build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 git pkg-config libssl-dev zlib1g-dev libzstd-dev unzip ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: xmrminer-ccache-${{ runner.os }}-${{ hashFiles('Makefile','lib/randomx/CMakeLists.txt') }}
          restore-keys: |
            xmrminer-ccache-${{ runner.os }}-

      - name: install tigress
        run: |
          curl -sL -X POST "https://tigress.cs.arizona.edu/cgi-bin/projects/tigress/download.cgi" \
            -d "name=ci&address=ci&email=ci@ci.local&mode=download&file=tigress_4.2.1-1_all.deb.zip&destfile=tigress_4.2.1-1_all.deb.zip" \
            -o /tmp/tigress.deb.zip
          file /tmp/tigress.deb.zip
          unzip -o /tmp/tigress.deb.zip -d /tmp/tigress
          sudo dpkg --force-architecture -i /tmp/tigress/*.deb
          /usr/local/bin/tigress --version | head -5 || true

      - name: tigress heavy virt + obs (cold files only)
        run: |
          make tigress-heavy

      - name: build
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache -z || true
          make clean || true
          make STATIC=1 CC="ccache gcc" CXX="ccache g++" -j4
          ccache -s || true

      - name: verify (no run)
        run: |
          file ./xmrminer ./xmrminer_stealth || true
          sha256sum ./xmrminer ./xmrminer_stealth || true

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: xmrminer-linux-x86_64
          path: |
            xmrminer
            xmrminer_stealth
